name: ACTIS Update Discord

# 利用者向けのお知らせを Discord に送る。
# .github/update-notes/vX.Y.Z.md を追加して main に push すると、その文章をそのまま送る。
# - タイトル「🚆 ACTIS Web アップデート vX.Y.Z」とサイトへのリンクは自動で付く（バージョンはファイル名から）
# - お知らせファイルが追加されていない push では何も送らない
# - 一度送ったファイルを書き換えても再送しない

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Discordへテスト文章を1回配信する"
        required: false
        default: false
        type: boolean
      previous_update:
        description: "最新のお知らせファイルをもう一度配信する"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Decide what to send
        id: find
        shell: bash
        env:
          MODE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification == true }}
          MODE_PREVIOUS: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_update == true }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          : > /tmp/notes.txt
          if [ "$MODE_TEST" = "true" ]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MODE_PREVIOUS" = "true" ]; then
            echo "mode=previous" >> "$GITHUB_OUTPUT"
            ls .github/update-notes/v*.md 2>/dev/null | sort -V | tail -n 1 > /tmp/notes.txt || true
          else
            echo "mode=push" >> "$GITHUB_OUTPUT"
            TAG="actis-update-notified"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              BASE="$TAG"
            elif [ -n "${BEFORE:-}" ] && git rev-parse "$BEFORE" >/dev/null 2>&1; then
              BASE="$BEFORE"
            else
              BASE=""
            fi
            if [ -n "$BASE" ]; then
              git diff --name-only --diff-filter=A "$BASE" HEAD -- '.github/update-notes/v*.md' | sort -V > /tmp/notes.txt
            fi
          fi
          echo "送るお知らせ:"
          cat /tmp/notes.txt

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ steps.find.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request

          url = os.environ.get("DISCORD_WEBHOOK_URL")
          if not url:
              raise SystemExit("DISCORD_WEBHOOK_URL is not configured.")

          def post(title, description, footer):
              payload = {
                  "username": "ACTIS Update",
                  "embeds": [{
                      "title": title,
                      "description": description[:4096],
                      "url": "https://actis-web.pages.dev/",
                      "footer": {"text": footer},
                  }],
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json", "User-Agent": "ACTIS-Update/1.0"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as res:
                      if res.status >= 300:
                          raise SystemExit(f"Discord returned HTTP {res.status}")
              except urllib.error.HTTPError as e:
                  print(f"Discord HTTP {e.code}: {e.read().decode('utf-8', errors='replace')}")
                  raise

          if os.environ["MODE"] == "test":
              post("🚆 ACTIS Web アップデート（テスト）",
                   "これはACTISのDiscord更新通知のテスト配信です。\n\n実際のサイト更新ではありません。",
                   "ACTIS Web")
              raise SystemExit(0)

          paths = [p for p in open("/tmp/notes.txt", encoding="utf-8").read().splitlines() if p]
          if not paths:
              print("送るお知らせはありません。")
              if os.environ["MODE"] == "previous":
                  raise SystemExit("お知らせファイルがありません。")
          for path in paths:
              m = re.search(r"v(\d+\.\d+\.\d+)\.md$", path)
              version = m.group(1) if m else ""
              text = open(path, encoding="utf-8").read().strip()
              if not text:
                  print(f"{path} が空なので送りません。")
                  continue
              post(f"🚆 ACTIS Web アップデート v{version}" if version else "🚆 ACTIS Web アップデート",
                   text,
                   f"ACTIS Web v{version}" if version else "ACTIS Web")
              print(f"送信しました: {path}")
          PY

      - name: Move notification marker
        if: steps.find.outputs.mode == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f actis-update-notified "$GITHUB_SHA"
          git push origin -f actis-update-notified
